<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sticker Desk</title>
  <meta name="description" content="Digital stickers that peel, carry and stick like real ones. Make your own from a photo, give it a finish, and download it.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sticker Desk">
  <meta property="og:description" content="Digital stickers that peel, carry and stick like real ones. Make your own from a photo, give it a finish, and download it.">
  <meta property="og:url" content="https://rheedesign.netlify.app/sticker-desk/">
  <meta property="og:image" content="https://rheedesign.netlify.app/sticker-desk/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#e9e2ff">
  <style>
    :root {
      --bg: #e9e2ff; --motif: #d0c3ff; --ink: #1c1b1f; --body: #3d3850; --muted: #5f5873;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1a1630; --motif: #2d2651; --ink: #f2f1f4; --body: #d6d1e4; --muted: #a9a2c0; }
    }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    /* Sticker wallpaper: one tile of black shapes (motifs.svg), tinted a shade deeper than the page. */
    body::before {
      content: ""; position: fixed; inset: -40px; z-index: -1; pointer-events: none;
      background: var(--motif);
      -webkit-mask: url(motifs.svg) 0 0 / 300px 300px repeat;
      mask: url(motifs.svg) 0 0 / 300px 300px repeat;
      transform: rotate(-6deg);
    }
    section { max-width: 1080px; margin: 0 auto; padding: 64px 16px 72px; }
    .intro { max-width: 620px; margin-bottom: 28px; }
    .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    h2 { font-size: clamp(30px, 5vw, 48px); letter-spacing: -.03em; margin: 8px 0 12px; }
    /* Darker than --muted, so it stays readable over the wallpaper without a card behind it. */
    p { color: var(--body); line-height: 1.55; margin: 0; font-weight: 500; }
    sticker-board { filter: drop-shadow(0 20px 40px rgba(40, 20, 90, .16)); }
    @media (max-width: 520px) {
      section { padding-top: 32px; }
    }
  </style>
  <script type="module" src="./sticker-board.js"></script>
</head>
<body>
  <section id="playground">
    <div class="intro">
      <div class="eyebrow">Playground</div>
      <h2>Sticker desk</h2>
      <p>Peel a sticker from its edge, carry it around and let go to stick it down. Make your own from a photo, give it a finish (matte, gloss, laminated, holographic or glitter), then download it, or arrange your stickers and save them as a wallpaper.</p>
    </div>
    <sticker-board height="580"></sticker-board>
  </section>
</body>
</html>
