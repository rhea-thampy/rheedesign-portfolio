<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <!-- One tile of the page's sticker wallpaper. The shapes are black: the page tints them through a CSS mask.
       Each motif is scaled by 0.9 around its own centre, so changing that resizes them without changing the spacing. -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="300" height="300">
      <rect width="300" height="300" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- smiley -->
        <path d="M45 68 Q60 83 75 68"/>
        <!-- emo face: fringe edge, one sleepy eye, flat mouth -->
        <path d="M262 126 C252 148 228 146 207 165" stroke-width="3.5"/>
        <path d="M244 153 Q250 158 256 153"/>
        <path d="M229 172 L246 169"/>
      </g>
      <g fill="#000">
        <ellipse cx="50" cy="54" rx="3.6" ry="5.2"/><ellipse cx="70" cy="54" rx="3.6" ry="5.2"/>
        <circle cx="75" cy="250" r="6"/>
      </g>
    </mask>
  </defs>
  <g fill="#000">
    <g transform="translate(60 60) scale(0.9) translate(-60 -60)"><g mask="url(#cut)"><circle cx="60" cy="60" r="29"/></g></g>
    <g transform="translate(195 54) scale(0.9) translate(-195 -54)"><g mask="url(#cut)"><polygon points="202.0,25.9 204.6,46.0 223.9,52.0 205.6,60.6 205.9,80.9 192.0,66.1 172.8,72.6 182.5,54.9 170.4,38.6 190.3,42.4"/></g></g>
    <g transform="translate(236 153) scale(0.9) translate(-236 -153)"><g mask="url(#cut)"><circle cx="238" cy="152" r="30"/><path d="M214 142 C204 150 200 160 198 172 C206 166 211 163 218 161Z"/></g></g>
    <g transform="translate(140 157) scale(0.9) translate(-140 -157)"><g mask="url(#cut)"><path transform="rotate(-12 140 160)" d="M140 178 C116 162 112 146 121 138 C129 131 138 135 140 143 C142 135 151 131 159 138 C168 146 164 162 140 178Z"/></g></g>
    <g transform="translate(75 250) scale(0.9) translate(-75 -250)"><g mask="url(#cut)"><circle cx="75.0" cy="237.0" r="11"/><circle cx="87.4" cy="246.0" r="11"/><circle cx="82.6" cy="260.5" r="11"/><circle cx="67.4" cy="260.5" r="11"/><circle cx="62.6" cy="246.0" r="11"/></g></g>
    <g transform="translate(215 251) scale(0.9) translate(-215 -251)"><g mask="url(#cut)"><polygon transform="rotate(14 215 250)" points="221,222 201,254 214,254 208,280 230,245 217,245 225,222"/></g></g>
    <g transform="translate(42 172) scale(0.9) translate(-42 -172)"><g mask="url(#cut)"><path d="M42 155 Q45.74 168.26 59 172 Q45.74 175.74 42 189 Q38.26 175.74 25 172 Q38.26 168.26 42 155Z"/></g></g>
    <g transform="translate(122 96) scale(0.9) translate(-122 -96)"><g mask="url(#cut)"><path d="M122 86 Q124.2 93.8 132 96 Q124.2 98.2 122 106 Q119.8 98.2 112 96 Q119.8 93.8 122 86Z"/></g></g>
    <g transform="translate(282 92) scale(0.9) translate(-282 -92)"><g mask="url(#cut)"><path d="M282 83 Q283.98 90.02 291 92 Q283.98 93.98 282 101 Q280.02 93.98 273 92 Q280.02 90.02 282 83Z"/></g></g>
    <g transform="translate(160 276) scale(0.9) translate(-160 -276)"><g mask="url(#cut)"><path d="M160 265 Q162.42 273.58 171 276 Q162.42 278.42 160 287 Q157.58 278.42 149 276 Q157.58 273.58 160 265Z"/></g></g>
    <g transform="translate(20 118) scale(0.9) translate(-20 -118)"><g mask="url(#cut)"><circle cx="20" cy="118" r="4"/></g></g>
    <g transform="translate(286 214) scale(0.9) translate(-286 -214)"><g mask="url(#cut)"><circle cx="286" cy="214" r="4"/></g></g>
    <g transform="translate(140 222) scale(0.9) translate(-140 -222)"><g mask="url(#cut)"><circle cx="140" cy="222" r="3"/></g></g>
    <g transform="translate(128 18) scale(0.9) translate(-128 -18)"><g mask="url(#cut)"><circle cx="128" cy="18" r="3"/></g></g>
